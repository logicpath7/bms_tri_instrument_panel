; Multi-Instrument Remote Panel — platformio.ini
; Board: Hosyond H076-A, ESP32-S3-N16R8 (16MB flash, 8MB OPI PSRAM)
;
; Expanded from the original USBTMC_Host.ino project's platformio.ini —
; same board, same USB-host build flags, same flash/PSRAM overrides.
; What changed: lib_deps (below), and the monitor_port note (see bottom).
;
; Flash procedure:
;   Hold BOOT, press+release RESET, release BOOT — USB port appears as DFU.
;   PlatformIO uploads via esptool (default). Press RESET to start sketch.
;
; Console: NONE. Native USB is the TMC host (same as before). Unlike the
;   original standalone USBTMC_Host.ino test sketch, UART1 and UART2 are
;   now BOTH committed to real instrument links (DMM and Counter,
;   respectively) — neither is available as a debug console anymore, and
;   there's no separate RS232-to-USB debug adapter in this build's wiring
;   at all. All firmware logging goes out over WebSocket as "sys" events,
;   visible in the browser's SCPI tab. See monitor_port note at the
;   bottom — it's vestigial now and can be removed or ignored.

[env:usbtmc_host]
; REQUIRED: pioarduino, not the stock "espressif32" platform. Confirmed
; at the bench — the stock package (3.20017.241212 / IDF 5.3.x at the
; time this was found) has a bug that makes usb_host_interface_claim()
; always return 0x106 regardless of what's connected, so the DG4062
; never enumerates no matter how correct the rest of the USB-TMC code
; is. See main.cpp's own file header for the full writeup.
; FILL IN the exact release you've actually built and bench-tested
; against before relying on this — placeholder below, not yet pinned to
; a specific version:
;   https://github.com/pioarduino/platform-espressif32/releases/download/<version>/platform-espressif32.zip
platform  = TODO_PIN_PIOARDUINO_RELEASE
board     = esp32-s3-devkitc-1
framework = arduino

; ── N16R8 hardware overrides (board picker defaults to 8MB/no PSRAM) ───────
board_build.flash_size  = 16MB
board_upload.flash_size = 16MB
board_build.psram_type  = opi

; ── USB mode: OTG host — native USB is TMC host, not CDC console ───────────
build_flags =
    -DARDUINO_USB_MODE=0          ; OTG mode — required for USB Host API
    -DARDUINO_USB_CDC_ON_BOOT=0   ; do not initialise CDC on boot
    -DBOARD_HAS_PSRAM

; ── Library dependencies ────────────────────────────────────────────────
; NEW in this merge — the original USBTMC_Host.ino project only needed
; WiFi/ESPmDNS (framework-bundled, no lib_deps entry needed for those).
; Pinned via direct GitHub tags rather than PlatformIO registry package
; names — ESPAsyncWebServer has several same-named forks in the wild
; (esphome's, mathieucarbou's, this one) and registry name resolution
; has been a recurring source of "wrong library" bugs in that ecosystem;
; pinning the exact repo+tag removes that ambiguity. Versions match what
; the DMM project's Arduino Library Manager README specifies
; ("ESP Async WebServer"/"ESP Async TCP" by ESP32Async).
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.11.2
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.10
    bblanchon/ArduinoJson@^7.0.0

; ── Serial monitor ─────────────────────────────────────────────────────
; VESTIGIAL — left from the original standalone USBTMC_Host.ino test
; sketch, which used a temporary RS232-to-USB debug adapter on this port
; since native USB was committed to TMC hosting. That debug adapter isn't
; part of this project's real wiring (UART1 → DMM, UART2 → Counter, both
; via MAX232 directly to instruments, no separate debug dongle) — there
; is nothing to open a monitor on. `pio device monitor` won't show
; anything useful; firmware logging is over WebSocket now (see the SCPI
; tab). Safe to delete the two lines below, or leave them — they're
; simply unused since nothing in the firmware writes to Serial anymore.
monitor_speed = 9600
monitor_port  = /dev/ttyUSB0
